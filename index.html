<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash Clone - Main Game</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
</head>
<body class="theme-dark">
    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Lobby UI Overlay -->
    <div id="lobbyOverlay" class="lobby-container">
        <!-- Top Navigation Header -->
        <header class="lobby-header">
            <div class="logo-group">
                <span class="logo-icon">▲</span>
                <h1 class="logo-title">GEOMETRY <span>DASH</span></h1>
            </div>

            <div class="header-actions">
                <a href="editor.html" class="btn-theme" style="text-decoration: none; display: flex; align-items: center; gap: 6px; font-weight: 800; color: #00f0ff; border-color: #00f0ff;">
                    <span>🛠️</span> LEVEL EDITOR
                </a>
                <div class="coin-badge">
                    <span class="coin-icon">🪙</span>
                    <span id="lobbyCoinCount" class="coin-amount">0</span>
                </div>
                <button id="themeToggleBtn" class="btn-theme" title="Toggle Theme">
                    <span id="themeIcon">☀️</span>
                    <span id="themeLabel">Light</span>
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="lobby-main">
            <!-- Left Side: Interactive Preview & Shop Button -->
            <section class="character-section">
                <div class="preview-card">
                    <div class="card-header">
                        <span class="card-title">SKIN PREVIEW</span>
                        <span id="selectedSkinBadge" class="skin-badge">CYBER CYAN</span>
                    </div>
                    <div class="preview-canvas-wrapper">
                        <canvas id="previewCanvas" width="200" height="200"></canvas>
                    </div>
                    <p id="skinDescText" class="skin-description">The original cyber cube.</p>
                    <button id="openShopBtn" class="btn-secondary">
                        <span class="btn-icon">🛒</span> SKIN SHOP
                    </button>
                </div>
            </section>

            <!-- Right Side: Level Selection Cards -->
            <section class="levels-section">
                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
                    <h2 class="section-title" style="margin-bottom:0;">TRACK LIST</h2>
                    <a href="editor.html" class="btn-secondary" style="font-size: 0.85rem; padding: 6px 14px; text-decoration: none;">
                        ➕ CREATE NEW LEVEL
                    </a>
                </div>

                <div id="lobbyLevelCards" class="level-cards">
                    <!-- Dynamic Level Cards populated from LevelDB -->
                </div>
                <div class="lobby-controls-hint">Press [SPACE] or Click to Jump • Press [B] for Auto-Bot Mode</div>
            </section>
        </main>

        <!-- Shop Modal Dialog -->
        <div id="shopModal" class="modal-overlay hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>SKIN SHOP</h2>
                    <div class="modal-header-right">
                        <div class="coin-badge modal-coins">
                            <span class="coin-icon">🪙</span>
                            <span id="shopCoinCount" class="coin-amount">0</span>
                        </div>
                        <button id="closeShopBtn" class="btn-close">&times;</button>
                    </div>
                </div>
                <div id="skinGrid" class="skin-grid">
                    <!-- Dynamic Skin Cards Injected via JS -->
                </div>
            </div>
        </div>

        <!-- Community Levels Modal Dialog -->
        <div id="communityModal" class="modal-overlay hidden">
            <div class="modal-content" style="max-width: 650px;">
                <div class="modal-header">
                    <h2>🌐 KOMUNITNÍ LEVELY</h2>
                    <button id="closeCommunityBtn" class="btn-close">&times;</button>
                </div>
                <div id="communityLevelsList" style="padding: 20px; display: flex; flex-direction: column; gap: 12px; max-height: 60vh; overflow-y: auto;">
                    <!-- Dynamic Community Level Cards -->
                </div>
            </div>
        </div>
    </div>

    <!-- In-Game Pause / HUD Overlay -->
    <div id="hudOverlay" class="hud-container hidden">
        <button id="lobbyReturnBtn" class="btn-lobby-return" onclick="returnToLobby()">🏠 Lobby</button>
        <div class="in-game-coins">
            <span class="coin-icon">🪙</span>
            <span id="hudCoinCount">0</span>
        </div>
    </div>

    <script src="level_db.js"></script>
    <script src="game.js"></script>
</body>
</html>
