<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Underground Geometry - Rap Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <div id="main-menu" class="overlay">
                <h1>UNDERGROUND GEOMETRY</h1>
                <div id="menu-buttons">
                    <button id="start-btn">NEW SESSION</button>
                    <div id="checkpoint-select-container" class="hidden">
                        <p>CONTINUE FROM:</p>
                        <div id="checkpoint-list"></div>
                    </div>
                </div>
            </div>
            <div id="game-over" class="overlay hidden">
                <h2>WIPED OUT</h2>
                <button id="retry-btn">RETRY</button>
                <button id="menu-btn-over">MENU</button>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
